# 复制本文件为 config.yaml，并填写所用服务的密钥。本地配置文件已由版本管理忽略。
# 环境变量优先于本地配置，本地配置优先于内置默认值。
# 环境变量使用大写字段路径，各层用双下划线分隔，例如 RAG__EMBEDDING__API_KEY 和 RAG__LLM__API_KEY。

llm:  # 回答生成与对话历史设置。
  base_url: "http://8.134.19.201:20089/v1"  # 回答生成使用的兼容接口根地址。
  api_key: ""  # 在本地配置或环境变量中填写生成服务密钥。
  model: "claude-sonnet-5"  # 设置模型。
  temperature: 0.2  # 设置采样温度。
  max_tokens: 2048  # 设置最大生成词元数。
  timeout_seconds: 120  # 设置超时秒数。
  history_turns: 6  # 追问改写和生成回答时最多保留的历史轮数。

embedding:  # 文本向量生成设置。
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 使用百炼的向量生成兼容接口。
  api_key: ""  # 填写百炼向量服务密钥。
  model: "qwen3.7-text-embedding-flash"  # 首次入库前运行 uv run python scripts/selfcheck.py 核实模型名及向量维度。
  batch_size: 10  # 设置单批文本数。
  max_retries: 5  # 设置临时故障时允许的总尝试次数。
  retry_base_delay_seconds: 1.0  # 设置初始退避秒数。

rerank:  # 候选文档重排设置。
  base_url: "https://dashscope.aliyuncs.com"  # 使用百炼原生服务根地址。
  path: "/api/v1/services/rerank/text-rerank/text-rerank"  # 重排模型使用此原生路径；兼容模式的重排路径会返回未找到。
  api_key: ""  # 可与向量生成服务共用百炼密钥。
  model: "qwen3.7-text-rerank"  # 所选模型由启动自检验证。
  timeout_seconds: 60  # 设置超时秒数。
  max_retries: 3  # 设置最大尝试次数。

milvus:  # 向量数据库设置。
  uri: "http://127.0.0.1:19530"  # 设置连接地址。
  token: ""  # 访问数据库的令牌，本地免认证服务可留空。
  child_collection: "rag_child"  # 本项目单独存放可检索的子块，避免与其他项目的集合混用。
  parent_collection: "rag_parent"  # 设置父块集合名。
  meta_collection: "rag_meta"  # 设置元数据集合名。
  consistency_level: "Strong"  # 强一致性确保上传完成后可立即查询；有界一致性下新数据可能延迟可见。

chunking:  # 父子分块设置。
  parent_target_chars: 1200  # 设置父块目标字符数。
  parent_max_chars: 2000  # 设置父块字符上限。
  child_target_chars: 320  # 设置子块目标字符数。
  child_overlap_chars: 60  # 设置相邻子块重叠字符数。
  semantic_enabled: true  # 只在结构切分仍不理想的超长片段中尝试语义切分。
  semantic_break_percentile: 88  # 按文档中相邻句子的余弦距离分布选择话题边界阈值。
  semantic_window_chars: 180  # 设置语义窗口字符数。

retrieval:  # 混合检索设置。
  dense_top_k: 40  # 设置向量召回条数。
  sparse_top_k: 40  # 设置关键词召回条数。
  rrf_k: 60  # 设置倒数排名融合常数。
  rerank_candidates: 30  # 设置重排候选数量。
  context_count: 6  # 设置上下文数量。
  context_min_count: 3  # 去除相同父块后，配置希望补足的最少上下文数。
  context_char_budget: 8000  # 设置上下文总字符预算。
  parent_excerpt_chars: 1800  # 父块过长时，以命中的子块为中心截取附近正文。

parsing:  # 文档解析设置。
  min_chars_per_page: 40  # 低于该平均字符密度的文档按扫描件处理。

mysql:  # 应用所在机器上原生安装的 MySQL 登记库。
  host: "127.0.0.1"  # 连接本机用于登记文档的 MySQL 实例。
  port: 3306  # 指定 MySQL 的监听端口。
  database: "rag_demo"  # 指定存放 documents 登记表的数据库。
  user: "rag_demo"  # 指定应用读写登记表使用的账号。
  password: ""  # 可通过 RAG__MYSQL__PASSWORD 设置。

storage:  # 本地持久化设置。
  embedding_cache_path: "data/embedding_cache"  # 按文本和模型生成缓存键，重复切块时可复用相同文本的向量。
  max_upload_mb: 50  # 设置单文件上传上限（兆字节）。

api:  # 应用监听设置。
  host: "127.0.0.1"  # 设置监听地址。
  port: 8000  # 设置监听端口。
